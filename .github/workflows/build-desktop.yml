name: Build desktop app (Windows / Mac / Linux)

# Como usar (sem precisar saber programar):
# 1. Suba este projeto para um repositório no GitHub (github.com).
# 2. Na página do repositório, clique na aba "Actions".
# 3. Clique em "Build desktop app (Windows / Mac / Linux)" na lista à esquerda.
# 4. Clique no botão "Run workflow" (canto direito) e depois em "Run workflow" de novo.
# 5. Espere uns minutos até todos os "jobs" ficarem verdes (✔).
# 6. Pronto! Os instaladores são publicados automaticamente numa Release pública
#    no GitHub (aba "Releases"), e:
#     - a página de download (servida pelo próprio backend, em /download)
#       sempre aponta pros arquivos mais recentes;
#     - quem já tem o app instalado recebe a atualização sozinho (o app confere
#       automaticamente ao abrir, e também tem um botão "Checar atualizações"
#       no canto da tela) — sem precisar desinstalar/instalar de novo.
#    A cada execução deste workflow, a versão do app é definida como
#    "1.0.<número da execução>", que sempre cresce — é assim que o app sabe
#    que existe algo mais novo pra baixar.

permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: squad-windows
            script: dist:win
            artifact_glob: desktop/release/*.exe
          - os: macos-latest
            name: squad-mac
            script: dist:mac
            artifact_glob: desktop/release/*.dmg
          - os: ubuntu-latest
            name: squad-linux
            script: dist:linux
            artifact_glob: desktop/release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do app desktop
        working-directory: desktop
        run: npm install

      - name: Definir versão desta build (sempre crescente)
        working-directory: desktop
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Gerar instalador e publicar na Release do GitHub
        working-directory: desktop
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Garantir que esta versão fique marcada como "Latest" no GitHub
        shell: bash
        # Isso existe por causa de uma release antiga (de antes desse workflow
        # publicar direto pelo electron-builder) que tinha ficado "presa" como
        # Latest — fazendo a página /download e o auto-update continuarem
        # apontando pros arquivos velhos mesmo depois de builds novas. Forçar
        # isso aqui toda vez evita que aconteça de novo no futuro.
        run: gh release edit "v1.0.${{ github.run_number }}" --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Também deixar disponível como artefato da execução (opcional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
